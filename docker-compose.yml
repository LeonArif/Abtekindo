services:
  postgres:
    image: postgres:17-alpine
    container_name: abtekindo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: abtekindo
      POSTGRES_PASSWORD: abtekindo
      POSTGRES_DB: abtekindo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abtekindo -d abtekindo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
